# Builds the Windows .exe + installers on a real Windows runner.
#
# Run it from the repo's Actions tab ("Run workflow"), or push a v* tag.
# Artifacts are attached to the run: an MSI, an NSIS setup .exe, and the
# bare portable .exe.
name: Windows build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      # Caches src-tauri/target between runs; the first build is ~10 min,
      # later ones are far quicker.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"

      - run: bun install --frozen-lockfile

      # Fail fast on the pure-logic tests before spending 10 minutes on Rust.
      - run: bun run test

      - run: bun run tauri build --target x86_64-pc-windows-msvc

      - uses: actions/upload-artifact@v4
        with:
          name: streamviv-windows-x64
          if-no-files-found: error
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/streamviv.exe
