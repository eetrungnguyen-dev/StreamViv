# Builds the macOS and Linux bundles on real runners.
#
# Windows lives in windows-build.yml and is deliberately left alone: it
# already works, and the three platforms have nothing in common beyond
# `tauri build` - each needs its own system dependencies, its own cache key
# and its own artifact set.
#
# Run from the Actions tab ("Run workflow"), or push a v* tag.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # One bundle that runs on both Apple Silicon and Intel Macs.
          - name: macOS (universal)
            runner: macos-14
            target: universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          # 22.04 rather than latest: glibc and WebKitGTK are backwards but
          # not forwards compatible, so building on the oldest supported LTS
          # is what makes the .deb and AppImage installable everywhere else.
          - name: Linux (x86_64)
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust-targets: x86_64-unknown-linux-gnu

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "src-tauri -> target"
          key: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev \
            libayatana-appindicator3-dev patchelf desktop-file-utils \
            gstreamer1.0-plugins-base gstreamer1.0-plugins-good

      - run: bun install --frozen-lockfile

      # Pure-logic tests first: they take seconds and catch most breakage
      # before ten minutes of Rust compilation.
      - run: bun test test/

      - run: bun run tauri build --target ${{ matrix.target }}

      - name: Upload macOS bundles
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: streamviv-macos-universal
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app

      - name: Upload Linux bundles
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: streamviv-linux-x86_64
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb
            src-tauri/target/${{ matrix.target }}/release/bundle/rpm/*.rpm
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            src-tauri/target/${{ matrix.target }}/release/streamviv
